name = "personal-blog"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
BLOG_TITLE = "My Blog"
POSTS_PER_PAGE = "10"

# Create KV namespace: npx wrangler kv namespace create BLOG_KV
# Then fill in the id below
[[kv_namespaces]]
binding = "BLOG_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

# Set secrets via: npx wrangler secret put ADMIN_USER
#                  npx wrangler secret put ADMIN_PASS
